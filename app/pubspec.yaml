name: horyzontal
description: "Горизонталь: координати, компас, задачі."
publish_to: none
version: 0.3.0+3
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.5.1
  camera: ^0.12.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  drift: ^2.35.2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_zxing: ^3.1.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  horyzontal_geo:
    path: ../packages/horyzontal_geo
  horyzontal_symbols:
    path: ../packages/horyzontal_symbols
  image: ^4.12.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  maplibre_gl: ^0.27.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pmtiles: ^2.2.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqlite3: ^3.7.0
  url_launcher: ^6.3.3
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/map/
    - assets/map/sprites/
    - assets/map/fonts/Noto Sans Regular/
    - assets/map/fonts/Noto Sans Medium/
    - assets/map/fonts/Noto Sans Italic/

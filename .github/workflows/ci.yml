name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geo:
    name: horyzontal_geo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
        working-directory: packages/horyzontal_geo
      - run: dart test --reporter expanded
        working-directory: packages/horyzontal_geo

  symbols:
    name: horyzontal_symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
        working-directory: packages/horyzontal_symbols
      # 15k symbols compared byte for byte with milsymbol, plus the catalogue.
      - run: dart test
        working-directory: packages/horyzontal_symbols

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: tools/ci/check_domains.sh
      - run: flutter pub get
      - name: Generated code is up to date
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
      - name: No ML Kit in the APK
        run: |
          if unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -iE 'mlkit|barhopper|gms/vision'; then
            echo "ML Kit native code or models in the APK"
            exit 1
          fi
      - name: No microphone or storage permissions
        run: |
          if grep -E 'RECORD_AUDIO|_EXTERNAL_STORAGE' app/build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml; then
            echo "A plugin brought in a permission the app does not need"
            exit 1
          fi

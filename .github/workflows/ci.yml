name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geo:
    name: horyzontal_geo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
        working-directory: packages/horyzontal_geo
      - run: dart test --reporter expanded
        working-directory: packages/horyzontal_geo

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: tools/ci/check_domains.sh
      - run: flutter pub get
      - name: Generated code is up to date
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build apk --debug
        working-directory: app
